services:
  ros2-pi:
    # --- Container & Image Setup ---
    build:
      context: ..
      dockerfile: docker/Dockerfile.pi
    image: ros2-jazzy-pi:latest
    container_name: ros2-pi

    # Giữ shell tương tác cho docker compose exec
    stdin_open: true
    tty: true

    # Tự khởi động lại cùng Raspberry Pi / Docker Daemon
    restart: unless-stopped

    # --- Network & Workspace ---
    # Dùng network host để giao tiếp DDS trực tiếp với PC
    network_mode: host
    working_dir: /ros2-ws

    # --- Environment Variables ---
    environment:
      # Cấu hình ROS 2 & RMW (Đồng bộ Domain ID với PC)
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///config/cyclonedds.pi.xml"
      ROS_AUTOMATIC_DISCOVERY_RANGE: "SUBNET"

    # --- User Groups & Device Permissions ---
    # Cấp quyền truy cập Serial, I2C, Camera & GPIO trên Raspberry Pi
    group_add:
      - dialout
      - video

    # Bỏ comment các thiết bị thực tế đang kết nối trên Raspberry Pi
    # devices:
    #   - /dev/ttyUSB0:/dev/ttyUSB0
    #   - /dev/ttyAMA0:/dev/ttyAMA0
    #   - /dev/i2c-1:/dev/i2c-1
    #   - /dev/video0:/dev/video0
    #   - /dev/gpiochip0:/dev/gpiochip0

    # --- Volumes ---
    volumes:
      # Mount mã nguồn dự án
      - ..:/ros2-ws

      # Cấu hình CycloneDDS (Bỏ :ro để entrypoint.sh ghi đè interface động)
      - ./cyclonedds.pi.xml:/config/cyclonedds.pi.xml

    # --- Runtime Command ---
    command: bash