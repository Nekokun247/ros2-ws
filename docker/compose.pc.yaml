services:
  ros2-pc:
    # --- Container & Image Setup ---
    build:
      context: ..
      dockerfile: docker/Dockerfile.pc
    image: ros2-jazzy-pc:latest
    container_name: ros2-pc

    # Giữ shell tương tác cho docker compose exec
    stdin_open: true
    tty: true

    # --- Network & Workspace ---
    # Dùng network host của WSL2 để giao tiếp DDS với RPi 5
    network_mode: host
    working_dir: /ros2-ws

    # --- Environment Variables ---
    environment:
      # Cấu hình ROS 2 & RMW
      ROS_DOMAIN_ID: "0"
      RMW_IMPLEMENTATION: "rmw_cyclonedds_cpp"
      CYCLONEDDS_URI: "file:///config/cyclonedds.pc.xml"
      ROS_AUTOMATIC_DISCOVERY_RANGE: "SUBNET"

      # Chuyển tiếp GUI qua WSLg / X11
      DISPLAY: "${DISPLAY}"
      WAYLAND_DISPLAY: "${WAYLAND_DISPLAY}"
      XDG_RUNTIME_DIR: "${XDG_RUNTIME_DIR}"
      QT_X11_NO_MITSHM: "1"

      # NVIDIA Container Toolkit (CUDA Compute)
      NVIDIA_VISIBLE_DEVICES: "all"
      NVIDIA_DRIVER_CAPABILITIES: "all"

      # OpenGL Rendering qua Mesa D3D12 (WSL2 GPU Paravirtualization)
      GALLIUM_DRIVER: "d3d12"
      MESA_D3D12_DEFAULT_ADAPTER_NAME: "NVIDIA"
      LD_LIBRARY_PATH: "/usr/lib/wsl/lib"

    # --- Hardware & Device Mapping ---
    # Kích hoạt NVIDIA GPU (CUDA)
    gpus: all

    # Thiết bị WSL2 GPU (/dev/dxg) & Cổng Serial USB (MCU/IMU)
    devices:
      - /dev/dxg:/dev/dxg
      # - /dev/ttyACM0:/dev/ttyACM0

    # Cấp quyền Đọc/Ghi
    device_cgroup_rules:
      - 'c *:* rmw'

    # --- Volumes ---
    volumes:
      # Mount mã nguồn dự án
      - ..:/ros2-ws

      # Cấu hình CycloneDDS (Bỏ :ro để entrypoint.sh ghi đè interface động)
      - ./cyclonedds.pc.xml:/config/cyclonedds.pc.xml

      # Thư viện driver WSL2 (OpenGL Mesa D3D12)
      - /usr/lib/wsl:/usr/lib/wsl:ro

      # Sockets hiển thị giao diện WSLg / X11
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /mnt/wslg:/mnt/wslg

      # Đồng bộ trực tiếp toàn bộ thư mục thiết bị từ Host vào Container
      - /dev:/dev

    # --- Runtime Command ---
    command: bash